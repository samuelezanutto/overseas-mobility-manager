services:

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/overseas
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - CORS_ORIGIN=http://localhost
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend/overseas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
