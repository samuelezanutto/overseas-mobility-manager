server {
    listen 80;

    # serve i file statici di Angular
    root /usr/share/nginx/html;
    index index.html;

    # tutte le route Angular (es. /login, /dashboard) tornano all'index.html
    # senza questo, un refresh su /dashboard darebbe 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gira le chiamate API al backend (container "backend" sulla porta 3000)
    location ~ ^/(auth|institutions|applications|users)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
