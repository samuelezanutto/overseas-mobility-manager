server {
    listen 80;

    # serve Angular's static files
    root /usr/share/nginx/html;
    index index.html;

    # all Angular routes (e.g. /login, /dashboard) fall back to index.html
    # without this, refreshing on /dashboard would give a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # forward API calls to the backend (container "backend" on port 3000)
    location ~ ^/(auth|institutions|applications|users)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
